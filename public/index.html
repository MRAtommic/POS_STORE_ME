<title>เครป ริมคลอง - สั่งอาหารออนไลน์</title>

<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
(function(){
  try {
    var t = localStorage.getItem('pos_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}
})();
</script>
